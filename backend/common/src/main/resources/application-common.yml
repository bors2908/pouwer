spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:/db/${spring.application.name}/changelog/master.xml

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
