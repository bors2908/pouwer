components:
  schemas:
    BadRequestErrorResponse:
      type: object
      description: Bad Request Error Response
      properties:
        code:
          type: string
          description: HTTP status code of the error
          example: 400
        message:
          type: string
          description: Description of the error
          example: Invalid input provided
      required:
      - code
    CarCreateDTO:
      type: object
      description: Car creation data transfer object
      properties:
        description:
          type: string
          description: Description of the car
        make:
          type: string
          description: Manufacturer of the car
          example: Toyota
        model:
          type: string
          description: Model of the car
          example: Camry
        technicalInfo:
          type: string
          description: Technical specifications of the car
        year:
          type: integer
          format: int32
          description: Year of manufacture
          example: 2022
      required:
      - make
      - model
      - year
    CarDTO:
      type: object
      description: Car data transfer object
      properties:
        _links:
          $ref: "#/components/schemas/Links"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the car was created
          example: 2023-01-01T00:00:00Z
        description:
          type: string
          description: Description of the car
        id:
          type: integer
          format: int64
          description: Unique identifier of the car
          example: 1
        make:
          type: string
          description: Manufacturer of the car
          example: Toyota
        model:
          type: string
          description: Model of the car
          example: Camry
        serviceState:
          type: string
          description: Service state of the car
          enum:
          - UNKNOWN
          - PREPARED
          - STAGED
          - CREATED
          - UPDATED
          - DELETED
        stagedChangeId:
          type: integer
          format: int64
          description: ID of the staged change if exists
        technicalInfo:
          type: string
          description: Technical specifications of the car
        year:
          type: integer
          format: int32
          description: Year of manufacture
          example: 2022
      required:
      - id
      - make
      - model
      - serviceState
      - year
    CarUpdateDTO:
      type: object
      description: Car update data transfer object
      properties:
        description:
          type: string
          description: Description of the car
        id:
          type: integer
          format: int64
          description: Unique identifier of the car to update
          example: 1
        make:
          type: string
          description: Manufacturer of the car
          example: Toyota
        model:
          type: string
          description: Model of the car
          example: Camry
        technicalInfo:
          type: string
          description: Technical specifications of the car
        year:
          type: integer
          format: int32
          description: Year of manufacture
          example: 2022
      required:
      - id
    ConflictErrorResponse:
      type: object
      description: Conflict Error Response
      properties:
        code:
          type: string
          description: HTTP status code of the error
          example: 409
        message:
          type: string
          description: Description of the error
          example: Data Conflict
      required:
      - code
    DeleteDTO:
      type: object
      properties:
        deleted:
          type: boolean
      required:
      - deleted
    EventCreateDTO:
      type: object
      description: Event creation data transfer object
      properties:
        comment:
          type: string
          description: Optional comment for the event
        crudAction:
          type: string
          description: CRUD action associated with the event
          enum:
          - CREATE
          - UPDATE
          - DELETE
        otherEventType:
          type: string
          description: Type of other event if not CRUD-related
          enum:
          - LOGIN
          - LOGOUT
          - REFRESH_TOKEN
        stagedStatus:
          type: string
          description: Status of the staged change if applicable
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        state:
          type: string
          description: Service state associated with the event
          enum:
          - UNKNOWN
          - PREPARED
          - STAGED
          - CREATED
          - UPDATED
          - DELETED
        subject:
          type: string
          description: Subject of the event (entity type)
          example: car
        subjectId:
          type: integer
          format: int64
          description: ID of the subject entity
          example: 42
      required:
      - subject
      - subjectId
    EventDTO:
      type: object
      description: Event data transfer object
      properties:
        _links:
          $ref: "#/components/schemas/Links"
        comment:
          type: string
          description: Optional comment for the event
        createdAt:
          type: string
