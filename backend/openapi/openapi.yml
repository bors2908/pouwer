          description: Service state associated with the event
          enum:
          - UNKNOWN
          - PREPARED
          - STAGED
          - CREATED
          - UPDATED
          - DELETED
        subject:
          type: string
          description: Subject of the event (entity type)
          example: car
        subjectId:
          type: integer
          format: int64
          description: ID of the subject entity
          example: 42
      required:
      - id
      - serviceState
      - subject
      - subjectId
    EventUpdateDTO:
