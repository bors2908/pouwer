server:
  port: 8089

gateway:
  host: localhost:8080

spring:
  profiles:
    active: openapi
  application:
    name: openapi

# TODO Lighten further by offloading Hibernate and Liquibase completely
  datasource:
    url: jdbc:h2:mem:openapi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  liquibase:
    enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  writer-with-order-by-keys: true

management:
  health:
    livenessState:
      enabled: false
    readinessState:
      enabled: false
