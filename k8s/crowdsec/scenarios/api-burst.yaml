type: leaky
name: local/api-burst
description: "Detect abusive API burst traffic for api.example.com"
filter: "evt.Meta.service == 'http' && evt.Meta.http_host == 'api.example.com' && evt.Meta.http_path startsWith '/v1/'"
groupby: "evt.Meta.source_ip"
capacity: 40
leakspeed: "1m"
blackhole: 5m
labels:
  service: http
  behavior: "http:api-abuse"
  confidence: 3
  remediation: true
  traffic_scope: api

