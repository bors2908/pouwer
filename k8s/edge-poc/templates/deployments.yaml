apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browser-web
  template:
    metadata:
      labels:
        app: browser-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: html
          configMap:
            name: browser-html
        - name: config
          configMap:
            name: browser-nginx-conf
---
