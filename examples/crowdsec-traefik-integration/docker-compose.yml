services:
  monero-testnet:
    image: ghcr.io/sethforprivacy/simple-monerod:v0.18.4.6
    container_name: monero-testnet
    restart: unless-stopped
    networks:
      - monero-net
    ports:
      - "18089:18089" # JSON-RPC restricted
      - "18088:18088" # ZMQ
    volumes:
      - type: bind
        source: D:/docker/monero-testnet-data
        target: /home/monero/.bitmonero
    command:
      - --testnet
      - --rpc-restricted-bind-ip=0.0.0.0
      - --rpc-restricted-bind-port=18089
      - --zmq-pub=tcp://0.0.0.0:18088
      - --no-igd
      - --enable-dns-blocklist
      - --prune-blockchain
      - --sync-pruned-blocks
      - --confirm-external-bind

  p2pool:
    image: ghcr.io/sethforprivacy/p2pool:v4.15
    container_name: p2pool
    restart: unless-stopped
    depends_on:
      monero-testnet:
        condition: service_started
    networks:
      - monero-net
    ports:
      - "3333:3333"
      - "37888:37888"
    volumes:
      - p2pool-data:/home/p2pool
      - /dev/hugepages:/dev/hugepages:rw
    command:
      - --host
      - "monero-testnet"
      - --rpc-port
      - "18089"
      - --zmq-port
      - "18088"
      - --wallet
      - "9wDZ4yA7aqiNQfnFrKsKQPM4jHyYRcdHdP5d5FDGa12YDs7QBFPwXgyZuk9WnCfAdvAKRWk4psFsYXb55xYGHgxmF6cxpUj"
      - --stratum
      - "0.0.0.0:3333"
      - --p2p
      - "0.0.0.0:37888"
      - --loglevel
      - "4"
      - --mini

  pouwer-server:
    image: localhost:9002/pouwer-server:0.1.1
    container_name: pouwer-server
    restart: unless-stopped
    environment:
      CHALLENGE_PLUGINS_DIRECTORY: /plugins
      STRATUM_HOST: p2pool
    ports:
      - "8082:8082"
    depends_on:
      p2pool:
        condition: service_started
      plugin-sync:
        condition: service_completed_successfully
    volumes:
      - pouwer-plugin-data:/plugins
    networks:
      - monero-net
      - app-net

  plugin-sync:
    build:
      context: ./plugin-sync-container
    container_name: plugin-sync
    restart: "no"
    environment:
      PLUGIN_REPO_URL: http://host.docker.internal:9001/repository/maven-hosted
      PLUGIN_TARGET_DIR: /plugins
    command:
      - --no-clean
      - --artifact
      - ge.becrin.pouwer:payload-bitcoin-rpc:0.1.1
      - --artifact
      - ge.becrin.pouwer:payload-sha256:0.1.1
      - --artifact
      - ge.becrin.pouwer:payload-monero-randomx:0.1.1
    volumes:
      - pouwer-plugin-data:/plugins
    extra_hosts:
      - host.docker.internal:host-gateway

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "cscli", "lapi", "status" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      PARSERS: "crowdsecurity/docker-logs crowdsecurity/cri-logs crowdsecurity/traefik-logs"
      BOUNCER_KEY_TRAEFIK: "${CROWDSEC_BOUNCER_KEY}"
      LOCAL_API_URL: "http://0.0.0.0:8080"
      DISABLE_ONLINE_API: "true"
      NO_HUB_UPGRADE: "true"
    volumes:
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./logs:/var/log
      - ./crowdsec/config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./crowdsec/config/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./crowdsec/config/parsers/s02-enrich/whitelists.yaml:/etc/crowdsec/parsers/s02-enrich/whitelists.yaml:ro
      - ./crowdsec/config/scenarios:/etc/crowdsec/scenarios:ro
    networks:
      - app-net

  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - crowdsec
      - pouwer-server
    ports:
      - "80:80"
      - "8081:8080"
    environment:
      CROWDSEC_BOUNCER_KEY: "${CROWDSEC_BOUNCER_KEY}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./browser/bundle/traefik-randomx/pages/challenge.html:/etc/traefik/captcha.html:ro
      - ./browser/bundle/traefik-randomx/pages/ban.html:/etc/traefik/ban.html:ro
      - ./logs/traefik:/var/log/traefik
    networks:
      - app-net

  browser-app:
    build:
      context: ./browser
    container_name: browser-app
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.browser.rule=(Host(`localhost`) || Host(`example.com`)) && Path(`/`)"
      - "traefik.http.routers.browser.entrypoints=web"
      - "traefik.http.routers.browser.priority=10"
      - "traefik.http.routers.browser.middlewares=browser-page-enforcement-chain@file"
      - "traefik.http.routers.browser-auth.rule=(Host(`localhost`) || Host(`example.com`)) && (Path(`/login`) || Path(`/logout`))"
      - "traefik.http.routers.browser-auth.entrypoints=web"
      - "traefik.http.routers.browser-auth.priority=50"
      - "traefik.http.routers.browser-auth.middlewares=browser-auth-enforcement-chain@file"
      - "traefik.http.routers.browser-auth.service=browser"
      - "traefik.http.services.browser.loadbalancer.server.port=3002"
      - "traefik.http.routers.browser-health.rule=(Host(`localhost`) || Host(`example.com`)) && Path(`/healthz`)"
      - "traefik.http.routers.browser-health.priority=100"
      - "traefik.http.routers.browser-health.entrypoints=web"
      - "traefik.http.routers.browser-health.service=browser"
    networks:
      - app-net

  api-app:
    build:
      context: example-apps/api
    container_name: api-app
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.example.com`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.middlewares=api-enforcement-chain@file"
      - "traefik.http.services.api.loadbalancer.server.port=3003"
      - "traefik.http.routers.api-health.rule=Host(`api.example.com`) && Path(`/healthz`)"
      - "traefik.http.routers.api-health.priority=100"
      - "traefik.http.routers.api-health.entrypoints=web"
      - "traefik.http.routers.api-health.service=api"
    networks:
      - app-net

networks:
  monero-net:
    name: monero-testnet_default
  app-net:

volumes:
  monero-testnet-data:
  p2pool-data:
  wallet-data:
  pouwer-plugin-data:
