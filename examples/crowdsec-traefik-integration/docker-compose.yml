services:
  monero-node:
    image: ghcr.io/sethforprivacy/simple-monerod:v0.18.4.6
    container_name: monero-node
    restart: unless-stopped
    networks:
      - monero-net
    ports:
      - "18089:18089" # JSON-RPC restricted
      - "18088:18088" # ZMQ
    volumes:
      - type: bind
        source: D:/docker/monero-mainnet-data
        #source: D:/docker/monero-testnet-data
        target: /home/monero/.bitmonero
    command:
      # - --testnet
      - --rpc-restricted-bind-ip=0.0.0.0
      - --rpc-restricted-bind-port=18089
      - --zmq-pub=tcp://0.0.0.0:18088
      - --no-igd
      - --enable-dns-blocklist
      - --prune-blockchain
      - --sync-pruned-blocks
      - --confirm-external-bind

  p2pool:
    image: ghcr.io/sethforprivacy/p2pool:v4.15
    container_name: p2pool
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "grep -q 0D05 /proc/net/tcp6 || grep -q 0D05 /proc/net/tcp" ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      monero-node:
        condition: service_started
    networks:
      - monero-net
    ports:
      - "3333:3333"
      - "37888:37888"
    volumes:
      - p2pool-data:/home/p2pool
      - /dev/hugepages:/dev/hugepages:rw
    command:
      - --host
      - "monero-node"
      - --rpc-port
      - "18089"
      - --zmq-port
      - "18088"
      - --wallet
      # Testnet random address
      # - "9wDZ4yA7aqiNQfnFrKsKQPM4jHyYRcdHdP5d5FDGa12YDs7QBFPwXgyZuk9WnCfAdvAKRWk4psFsYXb55xYGHgxmF6cxpUj"
      # Mainnet inaccessible burn address to destroy mined monero (https://monero.stackexchange.com/questions/10780/how-does-one-burn-and-provide-a-proof-of-burn-in-monero)
      - "46uVWiE1d4kWJM3aAoCpHVgDCm5higshGVJBb4ZNpTYARp8rLcCdcA1J8QgRfFWTzmJ8QgRfFWTzmJ8QgRfFWTzmCag5CXT"
      - --stratum
      - "0.0.0.0:3333"
      - --p2p
      - "0.0.0.0:37888"
      - --loglevel
      - "4"
      - --nano
      #- --mini

  pouwer-server:
    image: localhost:9002/pouwer-server:0.2.2
    container_name: pouwer-server
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      PAGES_EXTRACT_PATH: /pages
      CHALLENGE_PLUGINS_PRIORITY_OVERRIDE: monero-randomx,pow-test-sha256
      POUWER_PLUGIN_TRANSPORT_MODE: ${POUWER_PLUGIN_TRANSPORT_MODE:-rest}
      POUWER_PLUGIN_TRANSPORT_GRPC_PORT: 9091
    ports:
      - "8082:8082"
      - "9091:9091"
    volumes:
      - pouwer-pages-data:/pages
    networks:
      - monero-net
      - app-net

  pouwer-monero-plugin:
    image: localhost:9002/pouwer-monero-plugin:0.2.2
    container_name: pouwer-monero-plugin
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      SERVER_PORT: 8083
      STRATUM_HOST: p2pool
      PLUGIN_CORE_URL: http://pouwer-server:8082
      PLUGIN_HOST: http://pouwer-monero-plugin
      PLUGIN_CORE_TRANSPORT: ${POUWER_PLUGIN_TRANSPORT_MODE:-rest}
      PLUGIN_CORE_GRPC_HOST: pouwer-server
      PLUGIN_CORE_GRPC_PORT: 9091
    ports:
      - "8083:8083"
    depends_on:
      p2pool:
        condition: service_healthy
      pouwer-server:
        condition: service_healthy
    networks:
      - monero-net
      - app-net

  pouwer-sha256-plugin:
    image: localhost:9002/pouwer-sha256-plugin:0.2.2
    container_name: pouwer-sha256-plugin
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      SERVER_PORT: 8085
      STRATUM_HOST: p2pool
      PLUGIN_CORE_URL: http://pouwer-server:8082
      PLUGIN_HOST: http://pouwer-sha256-plugin
      PLUGIN_CORE_TRANSPORT: ${POUWER_PLUGIN_TRANSPORT_MODE:-rest}
      PLUGIN_CORE_GRPC_HOST: pouwer-server
      PLUGIN_CORE_GRPC_PORT: 9091
    ports:
      - "8085:8085"
    depends_on:
      pouwer-server:
        condition: service_healthy
    networks:
      - monero-net
      - app-net

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "cscli", "lapi", "status" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      PARSERS: "crowdsecurity/docker-logs crowdsecurity/cri-logs crowdsecurity/traefik-logs"
      BOUNCER_KEY_TRAEFIK: "${CROWDSEC_BOUNCER_KEY}"
      LOCAL_API_URL: "http://0.0.0.0:8080"
      DISABLE_ONLINE_API: "true"
      NO_HUB_UPGRADE: "true"
    volumes:
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./logs:/var/log
      - ./crowdsec/config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./crowdsec/config/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./crowdsec/config/parsers/s02-enrich/whitelists.yaml:/etc/crowdsec/parsers/s02-enrich/whitelists.yaml:ro
      - ./crowdsec/config/scenarios:/etc/crowdsec/scenarios:ro
    networks:
      - app-net

  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    user: "root"
    depends_on:
      crowdsec:
        condition: service_started
      pouwer-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "8081:8080"
    environment:
      CROWDSEC_BOUNCER_KEY: "${CROWDSEC_BOUNCER_KEY}"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./logs/traefik:/var/log/traefik
      - pouwer-pages-data:/pages:ro
    networks:
      - app-net
    extra_hosts:
      - host.docker.internal:host-gateway

  browser-app:
    build:
      context: example-apps/browser
    container_name: browser-app
    restart: unless-stopped
    networks:
      - app-net

  api-app:
    build:
      context: example-apps/api
    container_name: api-app
    restart: unless-stopped
    networks:
      - app-net

networks:
  monero-net:
    name: monero-node_default
  app-net:

volumes:
  p2pool-data:
  wallet-data:
  pouwer-pages-data:
