apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-app
  namespace: pouwer-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browser-app
  template:
    metadata:
      labels:
        app: browser-app
    spec:
      imagePullSecrets:
      - name: nexus-creds
      containers:
      - name: browser-app
        image: 172.21.0.1:9002/browser-app:0.1.0
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: browser-app
  namespace: pouwer-system
spec:
  selector:
    app: browser-app
  ports:
  - name: http
    port: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-app
  namespace: pouwer-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-app
  template:
    metadata:
      labels:
        app: api-app
    spec:
      imagePullSecrets:
      - name: nexus-creds
      containers:
      - name: api-app
        image: 172.21.0.1:9002/api-app:0.1.0
        ports:
        - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: api-app
  namespace: pouwer-system
spec:
  selector:
    app: api-app
  ports:
  - name: http
    port: 3003
