apiVersion: apps/v1
kind: Deployment
metadata:
  name: pouwer-server
  namespace: pouwer-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pouwer-server
  template:
    metadata:
      labels:
        app: pouwer-server
    spec:
      imagePullSecrets:
      - name: nexus-creds
      containers:
      - name: pouwer-server
        image: 172.21.0.1:9002/pouwer-server:0.2.5
        ports:
        - containerPort: 8082
        - containerPort: 9091
        env:
        - name: CHALLENGE_PLUGINS_PRIORITY_OVERRIDE
          value: "monero-randomx,pow-test-sha256"
        - name: POUWER_PLUGIN_TRANSPORT_MODE
          value: "rest"
        - name: POUWER_PLUGIN_TRANSPORT_GRPC_PORT
          value: "9091"
        - name: POUWER_TASK_STORE_TYPE
          value: "redis"
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "true"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pouwer-server
  namespace: pouwer-system
spec:
  selector:
    app: pouwer-server
  ports:
  - name: http
    port: 8082
  - name: grpc
    port: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pouwer-monero-plugin
  namespace: pouwer-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pouwer-monero-plugin
  template:
    metadata:
      labels:
        app: pouwer-monero-plugin
    spec:
      imagePullSecrets:
      - name: nexus-creds
      containers:
      - name: pouwer-monero-plugin
        image: 172.21.0.1:9002/pouwer-monero-plugin:0.2.5
        ports:
        - containerPort: 8083
        env:
        - name: SERVER_PORT
          value: "8083"
        - name: STRATUM_HOST
          value: "p2pool"
        - name: PLUGIN_CORE_URL
          value: "http://pouwer-server:8082"
        - name: PLUGIN_HOST
          value: "http://pouwer-monero-plugin"
        - name: PLUGIN_CORE_TRANSPORT
          value: "rest"
        - name: PLUGIN_CORE_GRPC_HOST
          value: "pouwer-server"
        - name: PLUGIN_CORE_GRPC_PORT
          value: "9091"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pouwer-monero-plugin
  namespace: pouwer-system
spec:
  selector:
    app: pouwer-monero-plugin
  ports:
  - name: http
    port: 8083
---
