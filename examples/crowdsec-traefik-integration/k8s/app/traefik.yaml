apiVersion: batch/v1
kind: Job
metadata:
  name: pouwer-pages-populate
  namespace: traefik
spec:
  template:
    spec:
      imagePullSecrets:
        - name: nexus-creds
      containers:
        - name: populate
          image: 172.21.0.1:9002/pouwer-pages:0.2.4
          env:
            - name: PAGES_DESTINATION
              value: "/pages"
          volumeMounts:
            - name: pouwer-pages
              mountPath: /pages
      restartPolicy: OnFailure
      volumes:
        - name: pouwer-pages
          persistentVolumeClaim:
            claimName: pouwer-pages-pvc-traefik
