apiVersion: v1
kind: PersistentVolume
metadata:
  name: pouwer-pages-pv-traefik
spec:
  capacity:
    storage: 128Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/pouwer-pages
  storageClassName: manual
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pouwer-pages-pvc-traefik
  namespace: traefik
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 128Mi
  storageClassName: manual
  volumeName: pouwer-pages-pv-traefik
