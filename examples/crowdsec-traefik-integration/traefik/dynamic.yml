http:
  middlewares:
    crowdsec-remediation-adapter:
      plugin:
        bouncer:
          enabled: true
          logLevel: DEBUG
          crowdsecMode: live
          crowdsecLapiScheme: http
          crowdsecLapiHost: crowdsec:8080
          crowdsecLapiPath: /
          crowdsecLapiKey: replace-with-long-random-key
          defaultDecisionSeconds: 1
          metricsUpdateIntervalSeconds: 0
          captchaProvider: custom
          captchaCustomKey: pouwer-firewall
          captchaCustomJsURL: http://localhost/static/monero-randomx/monero/challenge-monero.js
          captchaCustomValidateURL: http://pouwer-server:8082/validate-custom-captcha
          captchaCustomResponse: response
          captchaHTMLFilePath: /pages/challenge.html
          banHTMLFilePath: /pages/ban.html
          captchaGracePeriodSeconds: 60
          remediationHeadersCustomName: X-Crowdsec-Remediation

    api-rate-limit:
      rateLimit:
        average: 5
        burst: 5
        period: 1s

    browser-page-rate-limit:
      rateLimit:
        average: 5
        burst: 5
        period: 1s

    browser-auth-rate-limit:
      rateLimit:
        average: 2
        burst: 2
        period: 10s

    captcha-isolation-headers:
      headers:
        customResponseHeaders:
          Cross-Origin-Opener-Policy: same-origin
          Cross-Origin-Embedder-Policy: require-corp

    browser-page-enforcement-chain:
      chain:
        middlewares:
          - captcha-isolation-headers
          - crowdsec-remediation-adapter
          - browser-page-rate-limit

    browser-auth-enforcement-chain:
      chain:
        middlewares:
          - captcha-isolation-headers
          - crowdsec-remediation-adapter
          - browser-auth-rate-limit

    api-enforcement-chain:
      chain:
        middlewares:
          - crowdsec-remediation-adapter
          - api-rate-limit

  routers:
    pouwer-server-static:
      rule: "(Host(`localhost`) || Host(`example.com`)) && PathPrefix(`/static/`)"
      entryPoints:
        - web
      middlewares:
        - captcha-isolation-headers
      service: pouwer-server-static
      priority: 200

    browser:
      rule: "(Host(`localhost`) || Host(`example.com`)) && Path(`/`)"
      entryPoints:
        - web
      middlewares:
        - browser-page-enforcement-chain
      service: browser
      priority: 10

    browser-auth:
      rule: "(Host(`localhost`) || Host(`example.com`)) && (Path(`/login`) || Path(`/logout`))"
      entryPoints:
        - web
      middlewares:
        - browser-auth-enforcement-chain
      service: browser
      priority: 50

    browser-health:
      rule: "(Host(`localhost`) || Host(`example.com`)) && Path(`/healthz`)"
      entryPoints:
        - web
      service: browser
      priority: 100

    api:
      rule: "Host(`api.example.com`)"
      entryPoints:
        - web
      middlewares:
        - api-enforcement-chain
      service: api

    api-health:
      rule: "Host(`api.example.com`) && Path(`/healthz`)"
      entryPoints:
        - web
      service: api
      priority: 100

  services:
    challenge-monero-static:
      loadBalancer:
        servers:
          - url: http://challenge-monero:3001
    browser:
      loadBalancer:
        servers:
          - url: http://browser-app:3002
    api:
      loadBalancer:
        servers:
          - url: http://api-app:3003
    pouwer-server-static:
      loadBalancer:
        servers:
          - url: http://pouwer-server:8082
