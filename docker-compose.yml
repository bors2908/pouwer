services:
  monero-testnet:
    image: sethsimmons/simple-monerod:v0.18.3.4
    container_name: monero-testnet
    restart: unless-stopped
    networks:
      - monero-net
    ports:
      - "18089:18089" # JSON-RPC restricted
      - "18088:18088" # ZMQ
    volumes:
      - type: bind
        source: D:/docker/monero-testnet-data
        target: /home/monero/.bitmonero
    command:
      - --testnet
      - --rpc-restricted-bind-ip=0.0.0.0
      - --rpc-restricted-bind-port=18089
      - --zmq-pub=tcp://0.0.0.0:18088
      - --no-igd
      - --enable-dns-blocklist
      - --prune-blockchain
      - --sync-pruned-blocks
      - --confirm-external-bind

  p2pool:
    image: sethsimmons/p2pool:v4.3
    container_name: p2pool
    restart: unless-stopped
    depends_on:
      monero-testnet:
        condition: service_started
    networks:
      - monero-net
    ports:
      - "3333:3333"
      - "37888:37888"
    volumes:
      - p2pool-data:/home/p2pool
      - /dev/hugepages:/dev/hugepages:rw
    command:
      - --host
      - "monero-testnet"
      - --rpc-port
      - "18089"
      - --zmq-port
      - "18088"
      - --wallet
      - "9wDZ4yA7aqiNQfnFrKsKQPM4jHyYRcdHdP5d5FDGa12YDs7QBFPwXgyZuk9WnCfAdvAKRWk4psFsYXb55xYGHgxmF6cxpUj"
      - --stratum
      - "0.0.0.0:3333"
      - --p2p
      - "0.0.0.0:37888"
      - --loglevel
      - "4"
      - --mini

  backend:
    image: ${BACKEND_IMAGE:-pouw-backend:local}
    container_name: pouw-backend
    restart: unless-stopped
    environment:
      STRATUM_HOST: p2pool
    ports:
      - "8081:8081"
    depends_on:
      p2pool:
        condition: service_started
    networks:
      - monero-net
      - app-net

  frontend:
    image: ${FRONTEND_IMAGE:-pouw-frontend:local}
    container_name: pouw-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-net

networks:
  monero-net:
    name: monero-testnet_default
  app-net:

volumes:
  monero-testnet-data:
  p2pool-data:
  wallet-data:
  backend-postgres-data:
